name: variables_for_single_workflow..!

on:
  push:
   branches: ["variables"]

  workflow_dispatch:

env:
  MY_APP: "OPSBOARD"

jobs:
  workflow_variable:
    runs_on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: workflow variable
        run: echo "$MY_APP"
  
  job_level_variables:
    runs_on: ubuntu-latest
    env:
      MY_NAME: "Suraj"
    steps:
      - uses: actions/checkout@v4

      - name: job level variables
        run: echo "$MY_NAME"

  steps_level_variables:
    runs_on: ubuntu:latest
    steps:
      - uses: actions/checkout@v4
      
        env:
          MY_VAR: "Teliolabs"

      - name: step level variables
        run: echo "$MY_VAR"